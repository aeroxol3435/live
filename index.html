<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Shorts Viewer</title>

<style>
body {
  margin: 0;
  background: black;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  font-family: Arial, sans-serif;
}

.short {
  height: 100vh;
  width: 100%;
  position: relative;
  scroll-snap-align: start;
  display: flex;
  justify-content: center;
  align-items: center;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.overlay {
  position: absolute;
  bottom: 20px;
  left: 15px;
  color: white;
  text-shadow: 0 0 10px black;
  max-width: 80%;
}

.overlay h3 {
  margin: 0;
  font-size: 18px;
}

.overlay p {
  margin: 5px 0 0;
  font-size: 14px;
}
</style>
</head>

<body id="container">

<script>
const API_KEY = "AIzaSyC3TDNjA5SaaGDeAfW7guwbcafIXVWczCs";
let nextPageToken = "";
let loading = false;

async function loadShorts() {
  if (loading) return;
  loading = true;

  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=short&maxResults=10&pageToken=${nextPageToken}&key=${API_KEY}`
  );

  const data = await res.json();
  nextPageToken = data.nextPageToken || "";

  data.items.forEach(video => {
    createShort(video.id.videoId, video.snippet.title, video.snippet.channelTitle);
  });

  loading = false;
}

function createShort(videoId, title, channel) {
  const div = document.createElement("div");
  div.className = "short";

  div.innerHTML = `
    <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}"
    allow="autoplay; encrypted-media"
    allowfullscreen></iframe>

    <div class="overlay">
      <h3>${title}</h3>
      <p>${channel}</p>
    </div>
  `;

  document.getElementById("container").appendChild(div);
}

window.addEventListener("scroll", () => {
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
    loadShorts();
  }
});

loadShorts();
</script>

</body>
</html>
