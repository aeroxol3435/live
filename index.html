<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Live Player Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 15px;
  background: #181818;
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px 15px;
  background: red;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

#main {
  display: flex;
}

#left {
  flex: 3;
  padding: 15px;
}

#right {
  flex: 1;
  background: #181818;
  overflow-y: auto;
  height: 90vh;
}

.video-item {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid #333;
}

.video-item:hover {
  background: #222;
}

iframe {
  width: 100%;
  height: 500px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <input type="text" id="searchInput" placeholder="Search YouTube or paste link...">
  <button onclick="handleInput()">Go</button>
</header>

<div id="main">
  <div id="left">
    <div id="player"></div>
    <div id="chat"></div>
    <div id="comments"></div>
  </div>
  <div id="right"></div>
</div>

<script>
const API_KEY = "AIzaSyC3TDNjA5SaaGDeAfW7guwbcafIXVWczCs";

function extractVideoID(url) {
  try {
    const u = new URL(url);

    if (u.searchParams.get("v")) return u.searchParams.get("v");
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if (u.pathname.includes("/live/")) return u.pathname.split("/live/")[1];
    if (u.pathname.includes("/shorts/")) return u.pathname.split("/shorts/")[1];

    return null;
  } catch {
    return null;
  }
}

function handleInput() {
  const input = document.getElementById("searchInput").value.trim();

  if (input.includes("youtube.com") || input.includes("youtu.be")) {
    const id = extractVideoID(input);
    if (id) loadVideo(id);
  } else {
    searchYouTube(input);
  }
}

function loadVideo(videoId) {
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;

  document.getElementById("chat").innerHTML =
    `<iframe src="https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${location.hostname}" 
     width="100%" height="400"></iframe>`;

  loadComments(videoId);
}

async function searchYouTube(query) {
  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=${query}&key=${API_KEY}`
  );

  const data = await res.json();
  const container = document.getElementById("right");
  container.innerHTML = "";

  data.items.forEach(video => {
    const div = document.createElement("div");
    div.className = "video-item";
    div.innerHTML = `
      <img src="${video.snippet.thumbnails.medium.url}" width="100%">
      <p>${video.snippet.title}</p>
    `;
    div.onclick = () => loadVideo(video.id.videoId);
    container.appendChild(div);
  });
}

async function loadComments(videoId) {
  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${videoId}&maxResults=10&key=${API_KEY}`
  );

  const data = await res.json();
  const commentsDiv = document.getElementById("comments");
  commentsDiv.innerHTML = "<h3>Comments</h3>";

  if (!data.items) {
    commentsDiv.innerHTML += "<p>Comments disabled.</p>";
    return;
  }

  data.items.forEach(c => {
    const text = c.snippet.topLevelComment.snippet.textDisplay;
    commentsDiv.innerHTML += `<p style="border-bottom:1px solid #333;padding:5px;">${text}</p>`;
  });
}
</script>

</body>
</html>
